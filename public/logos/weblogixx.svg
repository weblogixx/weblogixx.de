<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sunny: Competition yellow with three 45° stripes rising from the bottom-left corner,
       like a 70s racing stripe. Same band widths as the hero (src/components/Stripes.astro), rotated 180°. -->
  <rect width="100" height="100" fill="#FDB515"/>
  <g fill="#F0532D">
    <polygon points="58,100 65,100 0,35 0,42"/>
    <polygon points="69,100 87,100 0,13 0,31"/>
    <polygon points="91,100 98,100 0,2 0,9"/>
  </g>
</svg>
