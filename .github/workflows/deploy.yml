# Build, check and upload the site to the web host via FTP on every push to main.
#
# Repo settings → Secrets and variables → Actions:
#   Secrets (hidden, masked in logs):
#     FTP_USERNAME   FTP user (ideally one restricted to the web folder)
#     FTP_PASSWORD   its password
#   Variables (readable; as secrets they'd be masked as *** all over the log):
#     FTP_SERVER     host name of the FTP server: the ALL-INKL server name (w0…….kasserver.com,
#                    see KAS), not the domain; its certificate is issued for *.kasserver.com
#     FTP_TARGET_DIR folder on the server the site goes into, e.g. / or /htdocs/
#
# The target folder is mirrored: files there that aren't in the build get DELETED (except the
# excludes below). Run it by hand with "dry run" first (Actions → Deploy → Run workflow) and
# check the log before the first real deploy.
#
# FTP over TLS (explicit, AUTH TLS): login and files are encrypted and the server certificate
# is verified. Still best to use a separate FTP user that only reaches the web folder.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be uploaded/deleted
        type: boolean
        default: true

permissions:
  contents: read

# One deployment at a time; don't cancel a running one mid-way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      # Same gate as locally: astro check + oxlint + oxfmt. A failure here blocks the deploy.
      - name: Check
        run: npm run check

      # Also fails while src/data/imprint.ts still has [placeholders].
      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via FTP
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          # lftp reads the password from LFTP_PASSWORD (--env-password): no quoting issues,
          # and it never appears on a command line.
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ vars.FTP_TARGET_DIR }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          for v in FTP_SERVER FTP_USERNAME LFTP_PASSWORD FTP_TARGET_DIR; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set (secret or variable, see the top of deploy.yml)"; exit 1; fi
          done
          # --delete: remove files that are gone from the build; .well-known/ (certificate
          # validation) and cgi-bin/ belong to the host and stay untouched.
          lftp -c "
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate true
            set net:max-retries 3
            set net:timeout 30
            open --user \"$FTP_USERNAME\" --env-password \"$FTP_SERVER\"
            mirror --reverse --delete --verbose --parallel=4 $DRY_RUN \
              --exclude-glob .well-known/ --exclude-glob cgi-bin/ \
              dist/ \"$FTP_TARGET_DIR\"
          "
